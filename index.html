<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechEase | Name and Email Form</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #132e47; background: #edf4fa; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.6; }
    header { background: #132e47; color: white; padding: 1rem max(1rem, calc((100% - 38rem) / 2)); }
    header a { color: white; margin-right: 1rem; }
    main { max-width: 38rem; margin: 2rem auto; padding: clamp(1rem, 5vw, 2.5rem); background: white; border: 1px solid #b6c9dc; border-radius: 1rem; }
    h1 { margin-top: 0; line-height: 1.2; }
    label { display: block; font-weight: 650; margin: 1rem 0 .25rem; }
    input { display: block; width: 100%; padding: .75rem; border: 1px solid #567089; border-radius: .35rem; font: inherit; }
    button { margin-top: 1.5rem; background: #155e9d; color: white; border: 0; border-radius: .4rem; padding: .8rem 1.4rem; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #132e47; }
    :focus-visible { outline: 3px solid #a35b00; outline-offset: 4px; }
    footer { margin: 1rem; text-align: center; }
    @media (max-width: 40rem) { main { margin: 1rem; } }
  </style>
</head>
<body>
  <header><a href="#main">Skip to form</a> <strong>TechEase</strong></header>
  <main id="main" tabindex="-1">
    <h1>Name and Email Form</h1>
    <p>Enter a name and email address to test this data collection form. Both fields are required. Use sample information for this class demonstration.</p>
    <!-- For GitHub Pages, replace save.php with the full HTTPS URL of your PHP handler. -->
    <form action="https://novagear.atwebpages.com/data-form/save.php" method="post">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <button type="submit">Submit</button>
    </form>
  </main>
  <footer>Mohammed Awuf · Data-Driven Web Form</footer>
</body>
</html>
